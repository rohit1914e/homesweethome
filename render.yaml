# Render Blueprint — FREE tier only (₹0). Verified against https://render.com/docs/blueprint-spec (2026-11-20).
# Do not change either `plan:` to anything other than `free`.
# Migrations + the six member accounts are applied automatically at startup
# (preDeployCommand is not available on free web services).
services:
  - type: web
    name: homesweethome
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Initial GPS places "lat,lng,radiusM" — entered in the Render dashboard (sync: false),
      # never committed, because this repo is public. Rohit can change them later in Settings.
      - key: HOME_PLACE
        sync: false
      - key: COLLEGE_PLACE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: homesweethome-db
          property: connectionString

databases:
  - name: homesweethome-db
    plan: free
    region: singapore
    databaseName: homesweethome
    user: homesweethome
    postgresMajorVersion: "17"
